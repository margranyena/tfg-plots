<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Episodi 2003: atmosfera i SST</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #5c6870;
      --line: #d7dde1;
      --paper: #ffffff;
      --bg: #f6f8f7;
      --accent: #087f8c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    main {
      width: min(1180px, calc(100% - 28px));
      height: 100vh;
      margin: 0 auto;
      padding: 22px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 780px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
    }
    button {
      border: 1px solid #b9c4cb;
      background: white;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .date {
      min-width: 110px;
      font-weight: 750;
      text-align: right;
    }
    figure {
      margin: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: white;
    }
    @media (max-width: 760px) {
      main { height: auto; min-height: 100vh; }
      .top { display: block; }
      .controls { grid-template-columns: 1fr auto; }
      .controls label { grid-column: 1 / -1; }
      input[type="range"] { grid-column: 1 / -1; }
      .date { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>Episodi d'agost de 2003</h1>
        <p>Slider diari del 3 d'agost al 2 de setembre de 2003. A l'esquerra, anomalia de geopotencial a 500 hPa; a la dreta, anomalia de SST al Mediterrani occidental.</p>
      </div>
      <a href="index.html">Tornar a l'index</a>
    </div>
    <div class="controls">
      <label for="daySlider">Dia</label>
      <input id="daySlider" type="range" min="0" max="30" value="0" step="1">
      <div id="dateLabel" class="date">2003-08-03</div>
      <button id="playButton" type="button">Play</button>
    </div>
    <figure>
      <img id="frame" src="episodi_2003_frames/episodi_2003_2003-08-03.jpg" alt="Episodi 2003: anomalia Z500 i SST">
    </figure>
  </main>
  <script>
    const frames = [
      "episodi_2003_2003-08-03.jpg",
      "episodi_2003_2003-08-04.jpg",
      "episodi_2003_2003-08-05.jpg",
      "episodi_2003_2003-08-06.jpg",
      "episodi_2003_2003-08-07.jpg",
      "episodi_2003_2003-08-08.jpg",
      "episodi_2003_2003-08-09.jpg",
      "episodi_2003_2003-08-10.jpg",
      "episodi_2003_2003-08-11.jpg",
      "episodi_2003_2003-08-12.jpg",
      "episodi_2003_2003-08-13.jpg",
      "episodi_2003_2003-08-14.jpg",
      "episodi_2003_2003-08-15.jpg",
      "episodi_2003_2003-08-16.jpg",
      "episodi_2003_2003-08-17.jpg",
      "episodi_2003_2003-08-18.jpg",
      "episodi_2003_2003-08-19.jpg",
      "episodi_2003_2003-08-20.jpg",
      "episodi_2003_2003-08-21.jpg",
      "episodi_2003_2003-08-22.jpg",
      "episodi_2003_2003-08-23.jpg",
      "episodi_2003_2003-08-24.jpg",
      "episodi_2003_2003-08-25.jpg",
      "episodi_2003_2003-08-26.jpg",
      "episodi_2003_2003-08-27.jpg",
      "episodi_2003_2003-08-28.jpg",
      "episodi_2003_2003-08-29.jpg",
      "episodi_2003_2003-08-30.jpg",
      "episodi_2003_2003-08-31.jpg",
      "episodi_2003_2003-09-01.jpg",
      "episodi_2003_2003-09-02.jpg"
    ];
    const dates = [
      "2003-08-03",
      "2003-08-04",
      "2003-08-05",
      "2003-08-06",
      "2003-08-07",
      "2003-08-08",
      "2003-08-09",
      "2003-08-10",
      "2003-08-11",
      "2003-08-12",
      "2003-08-13",
      "2003-08-14",
      "2003-08-15",
      "2003-08-16",
      "2003-08-17",
      "2003-08-18",
      "2003-08-19",
      "2003-08-20",
      "2003-08-21",
      "2003-08-22",
      "2003-08-23",
      "2003-08-24",
      "2003-08-25",
      "2003-08-26",
      "2003-08-27",
      "2003-08-28",
      "2003-08-29",
      "2003-08-30",
      "2003-08-31",
      "2003-09-01",
      "2003-09-02"
    ];
    const slider = document.getElementById("daySlider");
    const image = document.getElementById("frame");
    const dateLabel = document.getElementById("dateLabel");
    const playButton = document.getElementById("playButton");
    let timer = null;

    function showFrame(i) {
      const idx = Math.max(0, Math.min(frames.length - 1, Number(i)));
      slider.value = idx;
      image.src = "episodi_2003_frames/" + frames[idx];
      dateLabel.textContent = dates[idx];
    }

    function stop() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        playButton.textContent = "Play";
      }
    }

    slider.addEventListener("input", () => {
      stop();
      showFrame(slider.value);
    });

    playButton.addEventListener("click", () => {
      if (timer) {
        stop();
        return;
      }
      playButton.textContent = "Pausa";
      timer = setInterval(() => {
        let next = Number(slider.value) + 1;
        if (next >= frames.length) next = 0;
        showFrame(next);
      }, 650);
    });
  </script>
</body>
</html>

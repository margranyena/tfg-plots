<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapes controlables de l'escalfament i les MHW</title>
  <style>
    :root {
      --ink:#0b2a4a;
      --muted:#596875;
      --line:#d8e0e6;
      --bg:#f4f7f9;
      --panel:#fff;
      --accent:#0f7f8f;
      --accent-2:#b04a2f;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
    }
    main {
      width:min(1260px,calc(100vw - 32px));
      margin:0 auto;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:12px;
      padding:18px 0 20px;
    }
    header {
      display:grid;
      grid-template-columns:1fr auto;
      gap:16px;
      align-items:end;
    }
    h1 {
      margin:0;
      font-size:clamp(1.45rem,2.1vw,2.08rem);
      line-height:1.12;
      letter-spacing:0;
    }
    .note {
      margin:6px 0 0;
      max-width:900px;
      color:var(--muted);
      font-size:.94rem;
      line-height:1.35;
    }
    a {
      color:var(--accent);
      font-weight:650;
      text-decoration:none;
    }
    .tabs {
      display:inline-flex;
      align-items:center;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:8px;
      padding:3px;
      gap:3px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    button, select {
      font:inherit;
    }
    button {
      appearance:none;
      border:1px solid var(--line);
      border-radius:7px;
      padding:8px 12px;
      background:#fff;
      color:var(--ink);
      cursor:pointer;
    }
    .tabs button {
      border:0;
      background:transparent;
    }
    button[aria-pressed="true"] {
      background:var(--accent);
      color:#fff;
    }
    .viewer {
      min-height:0;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:8px;
      display:grid;
      grid-template-rows:1fr auto auto;
      overflow:hidden;
    }
    figure {
      margin:0;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      background:#fff;
    }
    img {
      display:block;
      max-width:100%;
      max-height:calc(100vh - 250px);
      object-fit:contain;
    }
    .caption {
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:.9rem;
      line-height:1.35;
      padding:10px 14px;
    }
    .controls {
      display:grid;
      grid-template-columns:auto auto auto 1fr auto auto;
      gap:10px;
      align-items:center;
      border-top:1px solid var(--line);
      padding:10px 12px 12px;
    }
    input[type="range"] {
      width:100%;
      min-width:160px;
      accent-color:var(--accent);
    }
    .frame-label {
      color:var(--ink);
      font-weight:700;
      white-space:nowrap;
      min-width:130px;
      text-align:right;
    }
    .hint {
      color:var(--muted);
      font-size:.82rem;
      white-space:nowrap;
    }
    @media (max-width:820px) {
      main { width:min(100vw - 20px,1260px); padding-top:12px; }
      header { grid-template-columns:1fr; align-items:start; }
      .tabs { justify-content:flex-start; }
      .tabs button { flex:1; min-width:110px; }
      img { max-height:calc(100vh - 330px); }
      .controls { grid-template-columns:auto auto auto; }
      .controls input[type="range"], .frame-label, .hint { grid-column:1 / -1; }
      .frame-label { text-align:left; }
    }
  </style>
</head>

        <h1>Mapes controlables de l'escalfament i les MHW</h1>
        <p class="note">Mapes anuals amb controls per pausar, avançar, retrocedir i inspeccionar cada any sense dependre del ritme d'un GIF.</p>
      </div>
      <div>

    </header>

    <section class="viewer">

      <div id="caption" class="caption"></div>
      <div class="controls">

        <button type="button" id="next" aria-label="Frame següent">Següent</button>
        <input id="slider" type="range" min="0" value="0" step="1" aria-label="Control temporal">
        <span id="frameLabel" class="frame-label"></span>
        <span class="hint">Tecles: espai, ←, →</span>

    </section>

    let active = 0;
    let frameIndex = 0;
    let timer = null;

    const tabs = document.getElementById("tabs");
    const image = document.getElementById("frame");
    const caption = document.getElementById("caption");
    const slider = document.getElementById("slider");
    const label = document.getElementById("frameLabel");
    const playButton = document.getElementById("play");

    function sequence() {
      return sequences[active];
    }

    function stop() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      playButton.textContent = "Play";
      playButton.setAttribute("aria-label", "Reproduir animació");
    }

    function renderTabs() {
      tabs.innerHTML = "";
      sequences.forEach((seq, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = seq.tab;
        button.setAttribute("aria-pressed", i === active ? "true" : "false");
        button.addEventListener("click", () => {
          stop();
          active = i;
          frameIndex = 0;
          renderTabs();
          update();
        });
        tabs.appendChild(button);
      });
    }

    function preload(seq) {
      seq.frames.forEach((src) => {
        const img = new Image();
        img.src = src;
      });
    }

    function update() {
      const seq = sequence();
      frameIndex = Math.max(0, Math.min(frameIndex, seq.frames.length - 1));
      image.src = seq.frames[frameIndex];
      image.alt = seq.alt;
      caption.textContent = seq.caption;
      slider.max = seq.frames.length - 1;
      slider.value = frameIndex;
      const currentLabel = seq.labels && seq.labels[frameIndex] ? seq.labels[frameIndex] : `Frame ${frameIndex + 1}`;
      label.textContent = `${currentLabel} · ${frameIndex + 1}/${seq.frames.length}`;
    }

    function step(delta) {
      const seq = sequence();
      frameIndex = (frameIndex + delta + seq.frames.length) % seq.frames.length;
      update();
    }

    function play() {
      if (timer) {
        stop();
        return;
      }
      playButton.textContent = "Pausa";
      playButton.setAttribute("aria-label", "Pausar animació");
      timer = setInterval(() => step(1), sequence().delay || 250);
    }

    document.getElementById("prev").addEventListener("click", () => {
      stop();
      step(-1);
    });
    document.getElementById("next").addEventListener("click", () => {
      stop();
      step(1);
    });
    playButton.addEventListener("click", play);
    slider.addEventListener("input", () => {
      stop();
      frameIndex = Number(slider.value);
      update();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        stop();
        step(-1);
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        stop();
        step(1);
      }
      if (event.key === " ") {
        event.preventDefault();
        play();
      }
    });

    renderTabs();
    sequences.forEach(preload);
    update();

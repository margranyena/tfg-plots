<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animacio de l'increment estival de SST</title>
  <style>
    :root {
      --ink: #172026;
      --muted: #5c6870;
      --line: #d7dde1;
      --paper: #ffffff;
      --bg: #f6f8f7;
      --accent: #c3422f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3.8rem);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 760px;
    }
    figure {
      margin: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.95rem;
      border-top: 1px solid var(--line);
    }
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
  </style>





















<!-- TFG_VIEWPORT_FIT_START -->
<style>
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  main {
    height: 100vh;
    padding: 12px 0 10px !important;
    display: flex;
    flex-direction: column;
  }
  .top {
    margin-bottom: 8px !important;
    padding-bottom: 8px !important;
    align-items: center !important;
    flex: 0 0 auto;
  }
  h1 {
    font-size: clamp(1.35rem, 2.4vw, 2.35rem) !important;
    line-height: 1 !important;
  }
  p {
    margin-top: 5px !important;
    font-size: 0.92rem !important;
  }
  figure {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  img {
    flex: 1 1 auto;
    width: auto !important;
    max-width: 100% !important;
    max-height: calc(100vh - 150px) !important;
    object-fit: contain;
    margin: 0 auto;
    background: #ffffff;
  }
  figcaption {
    flex: 0 0 auto;
    padding: 7px 10px !important;
    font-size: 0.84rem !important;
  }
  .actions {
    flex: 0 0 auto;
    margin-top: 7px !important;
    font-size: 0.88rem;
  }
  @media (max-height: 740px) {
    p { display: none; }
    img { max-height: calc(100vh - 112px) !important; }
  }
</style>
<!-- TFG_VIEWPORT_FIT_END -->

</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>Increment estival de SST</h1>
        <p>Increment positiu de la SST mitjana de maig-octubre respecte el periode 1940-1959. L'escala de color es fixa entre 0 i 3 &deg;C per fer visible l'escalfament progressiu.</p>
      </div>
      <a href="index.html">Tornar a l'index</a>
    </div>
    <figure>
      <img src="animacio_increment_sst_estiu.gif" alt="Animacio anual de l'increment estival de SST a la Mediterrania occidental">
      <figcaption>Els tons vermells indiquen SST estival mes alta que la referencia 1940-1959. El grafic incrustat mostra la mitjana regional acumulada any a any.</figcaption>
    </figure>
    <div class="actions">
      <a href="animacio_increment_sst_estiu.gif" download>Descarregar GIF</a>
      <a href="animacio_increment_sst_estiu_poster.png" download>Descarregar imatge resum</a>
    </div>
  </main>
</body>
</html>
